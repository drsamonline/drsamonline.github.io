<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found · Dr. Sohil Momin</title>
<meta name="description" content="That page doesn't exist. Head back to the project showcase.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#05060d">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="canonical" href="https://drsamonline.github.io/">
<style>
:root{--bg:#05060d;--ink:#eef1f8;--muted:#9aa3ba;--line:rgba(255,255,255,.1);--violet:#7c5cff;--cyan:#22d3ee}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,Arial,sans-serif;
  display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden;line-height:1.6}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:screen}
.b1{width:60vw;height:60vw;left:-15vw;top:-20vw;background:radial-gradient(circle,#7c5cff,transparent 65%)}
.b2{width:50vw;height:50vw;right:-12vw;bottom:-16vw;background:radial-gradient(circle,#22d3ee,transparent 65%)}
.wrap{max-width:560px}
.code{font-size:clamp(4.5rem,18vw,9rem);font-weight:800;letter-spacing:-.05em;line-height:1;
  background:linear-gradient(100deg,#fff,#b9a8ff,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:1.4rem;margin:8px 0 6px;letter-spacing:-.02em}
p{color:var(--muted);margin:0 0 26px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 24px;border-radius:13px;font-weight:700;font-size:.95rem;text-decoration:none;
  background:linear-gradient(100deg,#7c5cff,#22d3ee);color:#05060d;box-shadow:0 16px 40px -14px rgba(124,92,255,.9)}
.btn.ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line);box-shadow:none;margin-left:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i></div>
<div class="wrap">
  <div class="code">404</div>
  <h1>This page drifted off the grid</h1>
  <p>The link you followed doesn't point anywhere here. The showcase hub — with 37 projects — is one click away.</p>
  <a class="btn" href="/">Back to the showcase</a>
  <a class="btn ghost" href="https://github.com/drsamonline" target="_blank" rel="noopener">GitHub</a>
</div>
</body>
</html>
