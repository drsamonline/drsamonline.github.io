name: Refresh project hub

# The hub no longer calls the GitHub API from the browser (that call was
# unauthenticated and rate-limited to 60 requests/hour per visitor IP, which is
# why visitors silently saw a stale snapshot). Instead this workflow runs on a
# schedule, uses the runner's authenticated token, and commits the data:
#
#   * repos.json                     — the same-origin data the page fetches
#   * index.html (embedded snapshot) — offline fallback, kept identical
#   * sitemap.xml                    — one <url> per project
#   * assets/shots/<repo>.webp       — local thumbnails (no thum.io, no 3rd party)
#
# build_hub.py MUST run before capture_shots.py: the capture step reads the
# freshly written repos.json (including each repo's current `pushed` timestamp,
# which drives source-based thumbnail invalidation).
on:
  schedule:
    - cron: "17 3 * * *"        # daily, 03:17 UTC
  push:
    branches: [ main ]
    paths:
      - tools/build_hub.py
      - tools/capture_shots.py
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-capture of every thumbnail (ignore freshness checks)"
        type: boolean
        default: false

permissions:
  contents: write               # least privilege: commit the regenerated data + shots

concurrency:
  group: refresh-hub
  cancel-in-progress: false   # this workflow pushes; never cancel it mid-commit
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --quiet --disable-pip-version-check pillow playwright

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Build data (repos.json + embedded snapshot + sitemap + JSON-LD)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_hub.py

      - name: Capture local thumbnails (assets/shots/*.webp)
        env:
          FORCE_CAPTURE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python tools/capture_shots.py

      - name: Commit the refreshed hub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repos.json index.html sitemap.xml assets/shots
          if git diff --cached --quiet; then
            echo "Nothing changed — hub already up to date."
            exit 0
          fi
          git commit -m "chore: refresh hub data and screenshots"
          # retry: a bare `git push` loses the race when anything else commits first
          BR="${GITHUB_REF_NAME:-main}"
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin "$BR" --quiet
            git rebase "origin/$BR" --quiet || { git rebase --abort || true; sleep 4; continue; }
            if git push --quiet origin "HEAD:$BR"; then pushed=1; break; fi
            echo "::warning::push rejected on attempt $attempt - the branch moved again"
            sleep 4
          done
          [ "$pushed" = 1 ] || { echo "::error::could not push after 4 attempts - another workflow keeps moving the branch"; exit 1; }
